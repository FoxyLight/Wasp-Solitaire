name: Android setup build and JVM tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tooling
        uses: android-actions/setup-android@v3
      - name: Install required Android platform
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"
      - name: Configure pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Test pure JVM engine scaffold and build Android debug APK
        run: gradle --no-daemon :game-engine:test :app:assembleDebug :app:testDebugUnitTest
