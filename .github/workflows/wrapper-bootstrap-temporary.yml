# Temporary self-cleaning setup workflow; remove after wrapper is committed.
name: Bootstrap verified Gradle wrapper (temporary)

on:
  push:
    branches: [fix/phase2-stabilization-ci-wrapper]

permissions:
  contents: write

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, 'chore: commit verified Gradle wrapper')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Generate official wrapper and verify published checksums
        shell: bash
        run: |
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin --gradle-distribution-sha256-sum 553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin --gradle-distribution-sha256-sum 553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          test -x gradlew
          grep -q "distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746" gradle/wrapper/gradle-wrapper.properties
      - name: Commit wrapper to stabilization branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "chore: commit verified Gradle wrapper"
            git push origin HEAD:fix/phase2-stabilization-ci-wrapper
          fi
